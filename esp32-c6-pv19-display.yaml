substitutions:
  device_name: "MUST_PH19"
  name: "must-ph19"
  device_location: "Tech Room"
  device_description: "Monitor MUST inverter via RS485 on ESP32-C6"
  tx_pin: GPIO1
  rx_pin: GPIO2
  tx_pin2: GPIO4
  rx_pin2: GPIO5
  update_interval: 120s
  external_components_source: github://syssi/esphome-jk-bms@main

esphome:
  name: ${name}
  min_version: 2024.11.0
  comment: ${device_location}

# external_components:
#   - source: github://pr#8032
#     components: [ modbus, uart, modbus_controller ]

external_components:
  - source: ${external_components_source}
    refresh: 0s

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.33
    subnet: 255.255.255.0
    gateway: 192.168.1.1
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80
  version: 3

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6
  interface: hardware

logger:
  hardware_uart: USB_SERIAL_JTAG

uart:
  - id: mod_bus
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: 19200
    stop_bits: 1
    parity: NONE
    data_bits: 8
    rx_buffer_size: 4096
    debug:
      direction: BOTH
      after:
        timeout: 100ms
      sequence:
        - lambda: |-
            if (direction == UART_DIRECTION_TX) {
              id(flash_tx).execute();
            } else {
              id(flash_rx).execute();
            }
  - id: bms_bus
    tx_pin: ${tx_pin2}
    rx_pin: ${rx_pin2}
    baud_rate: 115200
    rx_buffer_size: 384
    debug:
      direction: BOTH
      after:
        timeout: 100ms
      sequence:
        - lambda: |-
            if (direction == UART_DIRECTION_TX) {
              id(flash_tx2).execute();
            } else {
              id(flash_rx2).execute();
            }

modbus:
  id: mod_bus_must
  uart_id: mod_bus
  send_wait_time: 1000ms

jk_modbus:
  id: modbus0
  uart_id: bms_bus
  rx_timeout: 50ms
jk_bms:
  id: bms0
  jk_modbus_id: modbus0

modbus_controller:
  - id: must
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 30s
    command_throttle: 500ms

color:
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: color_red
    red: 100%
    green: 0%
    blue: 0%
  - id: color_green
    red: 0%
    green: 100%
    blue: 0%
  - id: color_blue
    red: 0%
    green: 50%
    blue: 100%
  - id: color_yellow
    red: 100%
    green: 100%
    blue: 0%

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_medium
    size: 20
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_large
    size: 36
    bpp: 4

display:
  - platform: st7789v
    model: Waveshare 1.47in 172X320
    cs_pin: GPIO14
    dc_pin: GPIO15
    reset_pin: GPIO21
    rotation: 270
    update_interval: 200ms
    backlight_pin: NO
    <<: !include display_logic.yaml


text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
  - platform: jk_bms
    errors:
      name: "${name} errors"
    operation_mode:
      name: "${name} operation mode"
    battery_type:
      name: "${name} battery type"
    password:
      name: "${name} password"
    device_type:
      name: "${name} device type"
    software_version:
      name: "${name} software version"
    manufacturer:
      name: "${name} manufacturer"
    total_runtime_formatted:
      name: "${name} total runtime formatted"

globals:
  - id: uart_tx_active
    type: bool
    initial_value: 'false'
  - id: uart_rx_active
    type: bool
    initial_value: 'false'
  - id: uart_tx2_active
    type: bool
    initial_value: 'false'
  - id: uart_rx2_active
    type: bool
    initial_value: 'false'

script:
  - id: flash_tx
    mode: restart
    then:
      - lambda: 'id(uart_tx_active) = true;'
      - delay: 150ms
      - lambda: 'id(uart_tx_active) = false;'
  - id: flash_rx
    mode: restart
    then:
      - lambda: 'id(uart_rx_active) = true;'
      - delay: 150ms
      - lambda: 'id(uart_rx_active) = false;'
  - id: flash_tx2
    mode: restart
    then:
      - lambda: 'id(uart_tx2_active) = true;'
      - delay: 150ms
      - lambda: 'id(uart_tx2_active) = false;'
  - id: flash_rx2
    mode: restart
    then:
      - lambda: 'id(uart_rx2_active) = true;'
      - delay: 150ms
      - lambda: 'id(uart_rx2_active) = false;'
  - id: update_led_color
    then:
      - lambda: |-
          auto call = id(onboard_led).turn_on();
          if (id(display_mode).state == "SOC") {
            float x = id(soc).state;
            if (!std::isnan(x)) {
              if (x < 20) {
                call.set_rgb(1.0, 0.0, 0.0);
              } else if (x < 50) {
                call.set_rgb(1.0, 1.0, 0.0);
              } else {
                call.set_rgb(0.0, 1.0, 0.0);
              }
              call.perform();
            }
          } else {
            float x = id(batt_voltage).state;
            if (!std::isnan(x)) {
              if (x < 49.0) {
                call.set_rgb(1.0, 0.0, 0.0);
              } else if (x < 51.5) {
                call.set_rgb(1.0, 1.0, 0.0);
              } else {
                call.set_rgb(0.0, 1.0, 0.0);
              }
              call.perform();
            }
          }

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    rgb_order: RGB
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    name: "Onboard LED"


  - platform: monochromatic
    name: "${device_name} Backlight"
    output: backlight_pwm
    id: lcd_backlight
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  # CE: - Charger Errors from 15213 (id:charger_error_message))
