    register_type: holding
    on_value:
      then:
        - script.execute: update_led_color

  - platform: modbus_controller
    address: 15201
    name: "Charger workstate"
    register_type: holding
    icon: mdi:battery-charging-50

  - platform: modbus_controller
    address: 15202
    name: "MPPT state"
    register_type: holding

  - platform: modbus_controller
    address: 15203
    name: "Charging state"
    register_type: holding

  - platform: modbus_controller
    id: inverter_error_message_1
    address: 25261
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: inverter_error_message_2
    address: 25262
    register_type: holding
    internal: true

  - platform: modbus_controller
